name: openela weekly merge

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lineage-23.2
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch openela/linux-4.14.y
        run: |
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch --no-tags openela linux-4.14.y

      - name: Compare against current HEAD
        id: check
        run: |
          NEW_HEAD=$(git rev-parse openela/linux-4.14.y)
          BASE=$(git merge-base HEAD openela/linux-4.14.y)
          echo "new_head=${NEW_HEAD}" >> "$GITHUB_OUTPUT"
          if [ "${NEW_HEAD}" = "${BASE}" ]; then
            echo "Already contains openela/linux-4.14.y@${NEW_HEAD}"
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list --count HEAD..openela/linux-4.14.y)
            echo "${COUNT} new commit(s) from openela/linux-4.14.y"
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge openela/linux-4.14.y
        if: steps.check.outputs.uptodate != 'true'
        id: merge
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHORT=$(git rev-parse --short openela/linux-4.14.y)
          set +e
          git merge --no-ff openela/linux-4.14.y \
            -m "Merge openela linux-4.14.y as of ${DATE} (${SHORT})"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort || true
            {
              echo 'conflicts<<CONFLICTS_EOF'
              printf '%s\n' "${CONFLICTS}"
              echo 'CONFLICTS_EOF'
            } >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_OUTPUT"

      - name: Push merge commit
        if: steps.check.outputs.uptodate != 'true' && steps.merge.outputs.failed != 'true'
        run: git push origin lineage-23.2

      - name: Open issue on conflict
        if: steps.merge.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newHead = `${{ steps.check.outputs.new_head }}`;
            const conflicts = `${{ steps.merge.outputs.conflicts }}`.trim() || '(none reported)';
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Weekly automatic merge of `openela/linux-4.14.y` into `lineage-23.2` failed with conflicts.',
              '',
              `- openela/linux-4.14.y HEAD: \`${newHead}\``,
              `- Workflow run: ${runUrl}`,
              '',
              'Conflicting paths:',
              '```',
              conflicts,
              '```',
              '',
              'Resolve locally:',
              '```',
              'git fetch https://github.com/openela/kernel-lts.git linux-4.14.y',
              'git checkout lineage-23.2',
              `git merge ${newHead}`,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `openela linux-4.14.y weekly merge conflict (${date})`,
              body,
            });
